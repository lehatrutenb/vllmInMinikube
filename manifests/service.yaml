apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  namespace: vllm-inference
spec:
  clusterIP: None
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-external
  namespace: vllm-inference
spec:
  type: NodePort
  selector:
    app: vllm
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vllm
  namespace: vllm-inference
spec:
  serviceName: vllm-service
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      initContainers:
        - name: init-model-weights
          image: vllm-init-weights:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_ID
            - name: MODELS_DIR
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODELS_DIR
            - name: FORCE_DOWNLOAD
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: FORCE_DOWNLOAD
            - name: HUGGING_FACE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: HUGGING_FACE_TOKEN
          volumeMounts:
            - name: model-weights
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: hf-home
              mountPath: /.hf_home
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: vllm
          image: vllm-inference:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: vllm-config
          env:
            - name: VLLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vllm-secrets
                  key: VLLM_API_KEY
          args:
            - --host
            - $(HOST)
            - --port
            - $(PORT)
            - --max-model-len
            - $(MAX_MODEL_LEN)
            - --gpu-memory-utilization
            - "0.3"
            - --kv-cache-memory-bytes
            - "512M"
            - --max-num-batched-tokens 
            - "2048"
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: model-weights
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
            - name: vllm-home
              mountPath: /home/vllm
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        - name: tmp
          emptyDir: {}
        - name: vllm-home
          emptyDir: {}
        - name: hf-home
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: model-weights
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi